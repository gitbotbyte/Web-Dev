<style>
:root{--ink:#172b27;--muted:#74817d;--line:#e8eeeb;--paper:#f7f9f7;--green:#1a755e;--mint:#e8f4ef;--lime:#dff36b;--white:#fff;--red:#d9685d;--amber:#bd8b39;--shadow:0 14px 44px #173d2c0b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:244px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;font-weight:760;font-size:20px;letter-spacing:-.6px;padding:0 9px}.brandmark{width:34px;height:34px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:white;font-size:18px}.workspace{margin:0 4px;padding:12px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.workspace b{display:block;color:var(--ink);font-size:13px}.wsicon{background:#eff5f1;border-radius:8px;padding:7px;color:var(--green)}.navlabel{color:#9aa5a0;text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:1px;padding:0 12px;margin-bottom:-18px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;color:#63706c;border-radius:9px;padding:10px 12px;display:flex;gap:11px;align-items:center;font-weight:550}.nav button:hover,.nav button.active{background:#edf5f1;color:var(--green)}.nav .ico{width:18px;text-align:center;font-size:16px}.sidebottom{margin-top:auto}.upgrade{background:#f1f6f2;padding:15px;border-radius:12px;font-size:12px;color:var(--muted)}.upgrade b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}.profile{display:flex;align-items:center;gap:10px;padding:12px 7px 0;border-top:1px solid var(--line);margin-top:14px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e8efe9;color:var(--green);font-weight:700}.profile b{display:block;font-size:13px}.profile small{color:var(--muted)}main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);background:#ffffffbf;display:flex;align-items:center;justify-content:space-between;padding:0 42px}.crumb{color:var(--muted)}.crumb strong{color:var(--ink);font-weight:600}.topactions{display:flex;align-items:center;gap:12px}.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:white;color:var(--muted);width:205px}.iconbtn{width:36px;height:36px;border:1px solid var(--line);background:white;border-radius:9px;color:#67746f}.content{max-width:1320px;margin:auto;padding:34px 42px 60px}.welcome{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--green);font-weight:700}.welcome h1{font-size:28px;letter-spacing:-.9px;margin:4px 0}.welcome p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:600}.btn:hover{border-color:#b9cec3}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.primary:hover{background:#145e4b}.btn.soft{background:var(--mint);border-color:var(--mint);color:var(--green)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:17px 18px}.metrichead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.metricicon{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#f1f6f3;color:var(--green)}.metricvalue{font-size:28px;font-weight:720;letter-spacing:-1px;margin:9px 0 2px}.trend{font-size:11px;color:var(--green)}.trend span{color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.9fr);gap:15px;margin-bottom:15px}.panel{padding:19px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panelhead h2{font-size:15px;letter-spacing:-.2px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:3px}.select{border:1px solid var(--line);border-radius:8px;color:#596762;background:white;padding:7px 9px;font-size:11px}.chart{height:205px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.chart text{fill:#89948f;font-size:10px}.chart .gridline{stroke:#edf1ef;stroke-width:1}.chart .line{fill:none;stroke:#208369;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart .area{fill:url(#fade)}.chart circle{fill:white;stroke:#208369;stroke-width:2}.sentimentrow{display:flex;justify-content:space-between;align-items:center;margin:17px 0 8px;font-size:12px}.sentimentrow label{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#60a887}.dot.neu{background:#e3b85c}.dot.neg{background:#d9786a}.progress{height:6px;background:#f0f3f1;border-radius:9px;margin:0 0 14px 18px;overflow:hidden}.progress i{height:100%;display:block;border-radius:9px;background:#60a887}.theme{margin-bottom:15px}.themehead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.themehead span:last-child{color:var(--muted)}.theme .progress{margin:0;height:5px}.tablepanel{padding:0;overflow:hidden}.tabletop{padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.tabletop h2{font-size:15px;margin:0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:680px}th{text-align:left;text-transform:uppercase;letter-spacing:.6px;font-size:10px;color:#919b96;font-weight:650;background:#fbfcfb;padding:11px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}td{padding:13px 18px;border-bottom:1px solid #f0f2f1;font-size:12px}tr:last-child td{border-bottom:0}.feedbacktext{max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:650;background:#eaf4ef;color:#3c8b69}.badge.neg{background:#fff0ed;color:#c36358}.badge.neu{background:#fff7e5;color:#a97a25}.badge.status{background:#f0f2f1;color:#65716c}.channel{color:#65716c}.views{display:none}.views.active{display:block}.viewtitle{display:flex;justify-content:space-between;align-items:center;margin:0 0 20px}.viewtitle h1{margin:0;font-size:25px}.empty{padding:44px 20px;text-align:center;color:var(--muted)}.feedbacktools{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}.feedbacktools input{border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:220px}.reportgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.reportcard{padding:18px}.reportcard h3{margin:0 0 5px}.reportcard p{color:var(--muted);font-size:12px}.chatbox{max-width:800px;margin:auto}.chatintro{text-align:center;padding:35px 0 18px}.chatintro .orb{margin:0 auto 14px;width:52px;height:52px;border-radius:18px;background:#e8f4ef;color:var(--green);display:grid;place-items:center;font-size:24px}.chatintro h2{margin:0 0 5px}.chatintro p{color:var(--muted);margin:0}.chatmessages{min-height:180px;display:grid;gap:12px;padding:10px}.bubble{padding:14px 16px;border-radius:13px;background:#f4f7f5;max-width:90%;white-space:pre-wrap}.bubble.user{justify-self:end;background:#e8f4ef}.askform{display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff}.askform input{flex:1;border:0;outline:0;padding:8px}.source{font-size:11px;color:var(--muted);padding:7px 10px;border-left:2px solid #b4d4c4}.overlay{position:fixed;inset:0;background:#13201d66;display:none;place-items:center;padding:18px;z-index:3}.overlay.open{display:grid}.modal{background:white;border-radius:16px;width:min(500px,100%);padding:23px;box-shadow:0 20px 70px #10251d30}.modal h2{margin:0 0 4px}.modal p{margin:0 0 18px;color:var(--muted);font-size:12px}.form{display:grid;gap:12px}.form label{font-size:12px;color:#586660;display:grid;gap:5px}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.form textarea{min-height:100px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:22px;right:24px;background:#193c30;color:white;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:5}.toast.show{display:block}.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:white}.loginhero{background:#143e32;color:white;padding:9vh 8vw;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.loginhero:after{content:"";position:absolute;width:480px;height:480px;border:1px solid #ffffff18;border-radius:50%;right:-120px;bottom:-150px;box-shadow:0 0 0 50px #ffffff09,0 0 0 100px #ffffff06}.loginhero h1{font-size:clamp(38px,5vw,66px);line-height:1.04;letter-spacing:-2px;max-width:540px;margin:40px 0 15px}.loginhero p{color:#bad2c7;font-size:16px;max-width:470px}.loginhero .brand{padding:0}.loginhero .brandmark{background:var(--lime);color:#173e32}.loginhero footer{color:#9eb9ac;font-size:12px}.loginbox{display:grid;place-items:center;padding:28px}.loginform{width:min(390px,100%)}.loginform h2{font-size:26px;margin:0 0 5px}.loginform>p{color:var(--muted);margin:0 0 24px}.loginform .form{gap:15px}.loginform .btn{margin-top:5px;padding:11px}.switch{color:var(--muted);text-align:center;font-size:12px;margin-top:18px}.switch button{border:0;background:none;color:var(--green);font-weight:700}.notice{font-size:12px;color:var(--red);min-height:18px}.mobilehead{display:none}@media(max-width:1000px){.shell{grid-template-columns:210px 1fr}.content{padding:28px 24px}.topbar{padding:0 24px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.shell{display:block}.sidebar{position:fixed;z-index:2;top:auto;bottom:0;height:64px;width:100%;padding:6px 10px;border-top:1px solid var(--line);border-right:0;display:block}.brand,.workspace,.navlabel,.sidebottom{display:none}.nav{display:flex;justify-content:space-around}.nav button{display:grid;justify-items:center;gap:0;padding:5px 8px;font-size:9px}.nav .ico{font-size:17px}.topbar{height:59px;padding:0 16px}.search{width:130px}.content{padding:24px 15px 88px}.welcome{display:block}.welcome h1{font-size:24px}.actions{margin-top:14px}.grid{grid-template-columns:1fr}.cards{gap:9px}.metric{padding:13px}.metricvalue{font-size:24px}.reportgrid{grid-template-columns:1fr}.login{grid-template-columns:1fr}.loginhero{display:none}.loginbox{min-height:100vh}.views .viewtitle{align-items:flex-start}.feedbacktools input{width:100%}}
</style></head><body><div id="root"></div><div class="overlay" id="modal"></div><div class="toast" id="toast"></div>
<script src="/config.js"></script>
<script>
const API=window.LOOP_API_BASE_URL||"http://localhost:5000/api";let token=localStorage.getItem('loop_token'),user=JSON.parse(localStorage.getItem('loop_user')||'null'),active='Overview',feedback=[],overview={},analytics={};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const res=await fetch(API+path,{...opts,headers:{...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});let data;try{data=await res.json()}catch{data={}}if(!res.ok)throw Error(data.message||'Request failed ('+res.status+')');return data}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2800)}function initials(n='LO'){return n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}function login(){document.body.innerHTML=`<div class="login"><section class="loginhero"><div><div class="brand"><span class="brandmark">↗</span> LOOP</div><div><div class="eyebrow" style="color:#b8e4cf">FEEDBACK, IN FOCUS</div><h1>Every voice.<br>One clear direction.</h1><p>Turn customer conversations into the insights your team needs to build what matters.</p></div></div><footer>Customer intelligence, made actionable.</footer></section><section class="loginbox"><div class="loginform"><div class="eyebrow">WELCOME TO LOOP</div><h2 id="authTitle">Sign in to your workspace</h2><p id="authSub">Your customer insights are waiting.</p><form class="form" id="authForm"><div id="nameField" style="display:none"><label>Your name<input name="name" autocomplete="name"></label></div><div id="workspaceField" style="display:none"><label>Workspace name<input name="workspaceName"></label></div><label>Work email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><div class="notice" id="authError"></div><button class="btn primary" id="authSubmit">Sign in</button></form><div class="switch" id="authSwitch">New to LOOP? <button type="button" onclick="toggleAuth()">Create workspace</button></div></div></section></div>`}
let registering=false;function toggleAuth(){registering=!registering;$('#nameField').style.display=registering?'block':'none';$('#workspaceField').style.display=registering?'block':'none';$('#authTitle').textContent=registering?'Create your workspace':'Sign in to your workspace';$('#authSub').textContent=registering?'Start turning feedback into direction.':'Your customer insights are waiting.';$('#authSubmit').textContent=registering?'Create workspace':'Sign in';$('#authSwitch').innerHTML=registering?'Already have an account? <button type="button" onclick="toggleAuth()">Sign in</button>':'New to LOOP? <button type="button" onclick="toggleAuth()">Create workspace</button>'}
function shell(){document.body.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">↗</span> LOOP</div><div class="workspace"><span class="wsicon">▦</span><span><b>${esc(user?.workspaceName||'Your workspace')}</b>Workspace</span><span style="margin-left:auto">⌄</span></div><div class="navlabel">Workspace</div><nav class="nav">${[['Overview','◫'],['Feedback','▤'],['Insights','◉'],['Ask LOOP','✳'],['Reports','▧']].map(([n,i])=>`<button data-page="${n}" class="${active===n?'active':''}"><span class="ico">${i}</span>${n}</button>`).join('')}</nav><div class="sidebottom"><div class="upgrade"><b>Your feedback, in focus</b>LOOP brings every customer voice into one clear picture.</div><div class="profile"><div class="avatar">${initials(user?.name||user?.email||'LO')}</div><div><b>${esc(user?.name||'Team member')}</b><small>${esc(user?.role||'VIEWER')}</small></div><button class="iconbtn" style="margin-left:auto" onclick="logout()" title="Sign out">↪</button></div></div></aside><main><header class="topbar"><div class="crumb">Workspace&nbsp; / &nbsp;<strong id="crumb">${active}</strong></div><div class="topactions"><input class="search" id="globalSearch" placeholder="⌕  Search feedback"><button class="iconbtn" onclick="loadData()" title="Refresh">⟳</button><div class="avatar">${initials(user?.name||'LO')}</div></div></header><div class="content"><div id="view"></div></div></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){navigate('Feedback');setTimeout(()=>{const q=$('#feedbackSearch');if(q){q.value=e.target.value;renderFeedback()}},20)}};loadData()}
function navigate(n){active=n;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===n));$('#crumb').textContent=n;render()}
async function loadData(){try{const [ov,fb,sent,themes,volume,channels]=await Promise.all([api('/analytics/overview'),api('/feedback?limit=100'),api('/analytics/sentiment'),api('/analytics/themes'),api('/analytics/volume'),api('/analytics/channels')]);overview=ov.data||ov;feedback=fb.data||[];analytics={sent:sent.data||[],themes:themes.data||[],volume:volume.data||[],channels:channels.data||[]};render()}catch(e){if(e.message.toLowerCase().includes('token')||e.message.includes('Authentication'))logout();else toast(e.message)}}
function render(){const v=$('#view');if(!v)return;v.innerHTML=active==='Overview'?overviewView():active==='Feedback'?feedbackView():active==='Insights'?insightsView():active==='Ask LOOP'?askView():reportsView();if(active==='Feedback')wireFeedback()}
function stat(value,label,icon,trend){return `<div class="card metric"><div class="metrichead">${label}<span class="metricicon">${icon}</span></div><div class="metricvalue">${value??'—'}</div><div class="trend">${trend} <span>in your workspace</span></div></div>`}
function overviewView(){const total=overview.totalFeedback??feedback.length,negative=analytics.sent.find(x=>x.sentiment==='NEG')?.count||0,rate=Math.round(overview.negativePercentage||0),weekly=overview.newThisWeek??0;return `<div class="welcome"><div><div class="eyebrow">WORKSPACE OVERVIEW</div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, ${esc((user?.name||'there').split(' ')[0])} <span>✦</span></h1><p>Here’s what customers are saying about your product.</p></div><div class="actions"><button class="btn" onclick="document.querySelector('#csvInput').click()">↑ Import CSV</button><input type="file" id="csvInput" accept=".csv,text/csv" hidden onchange="importCsv(this)"><button class="btn primary" onclick="openFeedback()">＋ Add feedback</button></div></div><div class="cards">${stat(total,'Total feedback','▤',`${weekly} this week`)}${stat(rate+'%','Negative sentiment','↘',`${negative} responses`)}${stat((feedback.filter(f=>f.status==='ACTIONED').length),'Actioned','✓','Across all feedback')}${stat((analytics.themes.length),'Themes found','◉','AI-organized themes')}</div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>Feedback volume</h2><div class="sub">Daily feedback collected</div></div><span class="badge">Last 30 days</span></div><div class="chart">${volumeChart()}</div></section><section class="panel"><div class="panelhead"><div><h2>Sentiment breakdown</h2><div class="sub">How customers feel</div></div><span>✳</span></div>${sentimentRows()}</section></div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>Recent feedback</h2><div class="sub">Latest customer voices</div></div><button class="btn" onclick="navigate('Feedback')">View all →</button></div>${table(feedback.slice(0,5),false)}</section><section class="panel"><div class="panelhead"><div><h2>Top themes</h2><div class="sub">What customers talk about</div></div><button class="btn" onclick="navigate('Insights')">Explore →</button></div>${themeRows()}</section></div>`}
function volumeChart(){const arr=analytics.volume.slice(-14),vals=arr.map(x=>x.count),max=Math.max(1,...vals),points=vals.map((v,i)=>`${28+i*(540/Math.max(1,vals.length-1))},${175-v/max*142}`).join(' ');return `<svg viewBox="0 0 590 205" preserveAspectRatio="none"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#64aa8a" stop-opacity=".22"/><stop offset="1" stop-color="#64aa8a" stop-opacity="0"/></linearGradient></defs>${[35,80,125,170].map(y=>`<line class="gridline" x1="26" x2="575" y1="${y}" y2="${y}"/>`).join('')}<polygon class="area" points="${points} 568,175 28,175"/><polyline class="line" points="${points}"/>${arr.map((a,i)=>`<text x="${28+i*(540/Math.max(1,arr.length-1))}" y="198" text-anchor="middle">${new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text>`).join('')}</svg>`}
function sentimentRows(){const total=analytics.sent.reduce((a,x)=>a+x.count,0)||1;return [['POS','Positive','pos'],['NEU','Neutral','neu'],['NEG','Negative','neg']].map(([k,n,c])=>{const val=analytics.sent.find(x=>x.sentiment===k)?.count||0;return `<div class="sentimentrow"><label><i class="dot ${c==='pos'?'':c}"></i>${n}</label><b>${val} <span style="font-weight:400;color:var(--muted)">${Math.round(val/total*100)}%</span></b></div><div class="progress"><i style="width:${val/total*100}%;background:${c==='pos'?'#60a887':c==='neu'?'#e3b85c':'#d9786a'}"></i></div>`}).join('')}
function themeRows(){const rows=analytics.themes.slice(0,5),max=Math.max(1,...rows.map(x=>x.count));return rows.length?rows.map(x=>`<div class="theme"><div class="themehead"><span>${esc(x.theme||'Uncategorized')}</span><span>${x.count}</span></div><div class="progress"><i style="width:${x.count/max*100}%"></i></div></div>`).join(''):'<div class="empty">Themes will appear as feedback arrives.</div>'}
function sentiment(f){let s=f.sentiment||'NEU';return `<span class="badge ${s==='NEG'?'neg':s==='NEU'?'neu':''}">${s==='POS'?'Positive':s==='NEG'?'Negative':s==='NEU'?'Neutral':'Pending'}</span>`}function table(rows,tools=true){if(!rows.length)return '<div class="empty">No feedback yet. Add a customer voice to get started.</div>';return `<div class="tablewrap"><table><thead><tr><th>Feedback</th><th>Channel</th><th>Sentiment</th><th>Theme</th>${tools?'<th>Status</th>':''}</tr></thead><tbody>${rows.map(f=>`<tr><td><div class="feedbacktext" title="${esc(f.content)}">${esc(f.content)}</div><div class="sub">${esc(f.customerLabel||'Customer')} · ${new Date(f.createdAt).toLocaleDateString()}</div></td><td class="channel">${esc(f.channel)}</td><td>${sentiment(f)}</td><td>${esc(f.theme||'Uncategorized')}</td>${tools?`<td><select class="select" onchange="changeStatus('${f._id}',this.value)">${['NEW','REVIEWED','ACTIONED'].map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function feedbackView(){return `<div class="viewtitle"><div><div class="eyebrow">CUSTOMER VOICE</div><h1>Feedback</h1></div><div class="actions"><button class="btn" onclick="document.querySelector('#csvInput').click()">↑ Import CSV</button><input type="file" id="csvInput" accept=".csv,text/csv" hidden onchange="importCsv(this)"><button class="btn primary" onclick="openFeedback()">＋ Add feedback</button></div></div><div class="feedbacktools"><input id="feedbackSearch" placeholder="⌕  Search feedback text" oninput="renderFeedback()"><select class="select" id="sentimentFilter" onchange="renderFeedback()"><option value="">All sentiment</option><option value="POS">Positive</option><option value="NEU">Neutral</option><option value="NEG">Negative</option></select><select class="select" id="statusFilter" onchange="renderFeedback()"><option value="">All status</option><option>NEW</option><option>REVIEWED</option><option>ACTIONED</option></select><button class="btn" onclick="simulate()">✳ Generate sample feedback</button></div><div id="feedbackTable" class="panel tablepanel"></div>`}
function wireFeedback(){renderFeedback()}function renderFeedback(){const target=$('#feedbackTable');if(!target)return;const q=($('#feedbackSearch')?.value||'').toLowerCase(),s=$('#sentimentFilter')?.value||'',st=$('#statusFilter')?.value||'';const rows=feedback.filter(f=>(!q||f.content.toLowerCase().includes(q))&&(!s||f.sentiment===s)&&(!st||f.status===st));target.innerHTML=table(rows,true)}
function insightsView(){const total=feedback.length||1;return `<div class="viewtitle"><div><div class="eyebrow">AI-POWERED ANALYSIS</div><h1>Insights</h1></div><button class="btn" onclick="loadData()">⟳ Refresh</button></div><div class="cards">${stat(analytics.themes.length,'Emerging themes','◉','Across all feedback')}${stat(analytics.channels.length,'Feedback channels','↗','Connected sources')}${stat(Math.round((analytics.sent.find(x=>x.sentiment==='POS')?.count||0)/total*100)+'%','Positive sentiment','↗','Of total feedback')}${stat(Math.round((analytics.sent.find(x=>x.sentiment==='NEG')?.count||0)/total*100)+'%','Negative sentiment','↘','Of total feedback')}</div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>Sentiment breakdown</h2><div class="sub">Customer tone across all channels</div></div></div>${sentimentRows()}</section><section class="panel"><div class="panelhead"><div><h2>Most discussed themes</h2><div class="sub">Ranked by feedback volume</div></div></div>${themeRows()}</section></div><section class="panel"><div class="panelhead"><div><h2>Feedback by channel</h2><div class="sub">Where customer voices come from</div></div></div>${analytics.channels.length?analytics.channels.map(c=>`<div class="theme"><div class="themehead"><span>${esc(c.channel)}</span><span>${c.count} responses</span></div><div class="progress"><i style="width:${Math.min(100,c.count/Math.max(1,...analytics.channels.map(x=>x.count))*100)}%"></i></div></div>`).join(''):'<div class="empty">Channel data will appear as feedback arrives.</div>'}</section>`}
function askView(){return `<div class="viewtitle"><div><div class="eyebrow">YOUR FEEDBACK, ANSWERED</div><h1>Ask LOOP</h1></div></div><div class="panel chatbox"><div class="chatintro"><div class="orb">✳</div><h2>Ask a question about your customers</h2><p>LOOP finds answers in your workspace feedback and shows its sources.</p></div><div class="chatmessages" id="chatmessages"></div><form class="askform" id="askform"><input name="question" placeholder="What are customers saying about onboarding?" minlength="3" required><button class="btn primary">Ask LOOP ↑</button></form></div>`}
async function askQuestion(e){e.preventDefault();const input=e.target.question,q=input.value.trim();if(!q)return;const box=$('#chatmessages');box.insertAdjacentHTML('beforeend',`<div class="bubble user">${esc(q)}</div><div class="bubble" id="thinking">Looking through your feedback…</div>`);input.value='';try{const r=await api('/ai/ask',{method:'POST',body:JSON.stringify({question:q})});$('#thinking')?.remove();box.insertAdjacentHTML('beforeend',`<div><div class="bubble">${esc(r.answer)}</div>${(r.sources||[]).map((s,i)=>`<div class="source">Source ${i+1} · ${esc(s.channel)} · ${esc(s.sentiment||'')}<br>${esc(s.content)}</div>`).join('')}</div>`)}catch(err){$('#thinking').textContent=err.message}box.scrollTop=box.scrollHeight}
function reportsView(){setTimeout(loadReports,0);return `<div class="viewtitle"><div><div class="eyebrow">VOICE OF CUSTOMER</div><h1>Reports</h1></div><button class="btn primary" onclick="createReport()">✳ Generate report</button></div><div class="reportgrid" id="reportGrid"><div class="panel empty">Loading reports…</div></div>`} async function loadReports(){const grid=$('#reportGrid');if(!grid)return;try{const reports=(await api('/reports')).reports||[];grid.innerHTML=reports.length?reports.map(r=>`<article class="panel reportcard"><div class="eyebrow">GENERATED ${new Date(r.createdAt).toLocaleDateString()}</div><h3>${esc(r.title||'Voice of Customer Report')}</h3><p>${esc((r.content||'').slice(0,220))}${(r.content||'').length>220?'…':''}</p><button class="btn" onclick="showReport('${r._id}')">Read report →</button></article>`).join(''):'<div class="panel empty">No reports yet. Generate a Voice of Customer report from your workspace feedback.</div>'}catch(e){grid.innerHTML=`<div class="panel empty">${esc(e.message)}</div>`}}async function createReport(){try{await api('/reports',{method:'POST',body:JSON.stringify({})});toast('Voice of Customer report generated');render()}catch(e){toast(e.message)}}async function showReport(id){try{const r=(await api('/reports/'+id)).report;modal(`<h2>${esc(r.title||'Voice of Customer Report')}</h2><p>${new Date(r.createdAt).toLocaleDateString()}</p><div style="white-space:pre-wrap;max-height:55vh;overflow:auto;font-size:13px">${esc(r.content||'')}</div>`,true)}catch(e){toast(e.message)}}
function modal(body,readOnly=false){$('#modal').innerHTML=`<div class="modal">${body}<div class="modalfoot"><button class="btn" onclick="closeModal()">${readOnly?'Close':'Cancel'}</button>${readOnly?'': '<button class="btn primary" form="feedbackForm">Save feedback</button>'}</div></div>`;$('#modal').classList.add('open')}function closeModal(){$('#modal').classList.remove('open')}
function openFeedback(){modal(`<h2>Add feedback</h2><p>Capture a customer voice and LOOP will classify it automatically.</p><form id="feedbackForm" class="form"><label>Feedback<textarea name="content" required placeholder="What did the customer say?"></textarea></label><label>Channel<select name="channel"><option>Support Ticket</option><option>App Store</option><option>NPS Survey</option><option>Sales Call</option><option>Community</option><option>Email</option><option>Other</option></select></label><label>Customer label<input name="customerLabel" placeholder="Optional"></label></form>`);$('#feedbackForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/feedback',{method:'POST',body:JSON.stringify(d)});closeModal();toast('Feedback added and classified');await loadData()}catch(err){toast(err.message)}}}
async function changeStatus(id,status){try{const r=await api('/feedback/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});const i=feedback.findIndex(f=>f._id===id);if(i>=0)feedback[i]=r.feedback;toast('Feedback marked '+status.toLowerCase())}catch(e){toast(e.message);renderFeedback()}}
async function importCsv(input){if(!input.files?.[0])return;const form=new FormData();form.append('file',input.files[0]);try{const r=await api('/feedback/import',{method:'POST',body:form});toast(r.message||'CSV imported');await loadData()}catch(e){toast(e.message)}input.value=''}async function simulate(){try{const r=await api('/feedback/simulate',{method:'POST',body:'{}'});toast(r.message||'Sample feedback added');await loadData()}catch(e){toast(e.message)}}function logout(){localStorage.removeItem('loop_token');localStorage.removeItem('loop_user');token=null;user=null;login()}
document.addEventListener('submit',async e=>{if(e.target.id==='authForm'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const path=registering?'/auth/register':'/auth/login';const r=await api(path,{method:'POST',body:JSON.stringify(d)});token=r.token;user=r.user;localStorage.setItem('loop_token',token);localStorage.setItem('loop_user',JSON.stringify(user));shell()}catch(err){$('#authError').textContent=err.message}}if(e.target.id==='askform')askQuestion(e)});if(token&&user)shell();else login();
</script></body></html>
